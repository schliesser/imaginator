name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: cs-fixer + phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd, zip, fileinfo
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-lint-${{ hashFiles('composer.json') }}
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: .Build/bin/php-cs-fixer fix --dry-run --diff
      - run: .Build/bin/phpstan analyse -c Build/phpstan/phpstan.neon --no-progress

  unit:
    name: unit (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        typo3: ['^13.4', '^14.3']
        exclude:
          - { php: '8.5', typo3: '^13.4' } # TYPO3 13.4 tops out at PHP 8.4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, gd, zip, fileinfo
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
      - run: composer update --with="typo3/cms-core:${{ matrix.typo3 }}" --prefer-dist --no-progress --no-interaction
      - run: .Build/bin/phpunit -c Build/phpunit/UnitTests.xml

  functional:
    name: functional (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        typo3: ['^13.4', '^14.3']
        exclude:
          - { php: '8.5', typo3: '^13.4' }
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseName: t3func
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
    steps:
      - uses: actions/checkout@v4
      - name: Install GraphicsMagick
        run: sudo apt-get update && sudo apt-get install -y graphicsmagick
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, gd, zip, fileinfo
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
      - run: composer update --with="typo3/cms-core:${{ matrix.typo3 }}" --prefer-dist --no-progress --no-interaction
      - run: .Build/bin/phpunit -c Build/phpunit/FunctionalTests.xml

  js:
    name: vitest + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:js
      - run: npm test

  e2e-local:
    name: e2e (local processor)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install GraphicsMagick
        run: sudo apt-get update && sudo apt-get install -y graphicsmagick
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd, zip, fileinfo
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build the demo instance (local processor)
        run: bash Build/Scripts/setup-ci-instance.sh
      - name: Start TYPO3 and warm up
        env:
          PHP_CLI_SERVER_WORKERS: '4' # serve the page's parallel asset/image requests concurrently
        run: |
          php -S 127.0.0.1:8080 -t .Build/public Build/ci/router.php >/tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ -o /dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8080/ -o /dev/null
      - name: Run Playwright (frontend <picture> + sizes="auto" polyfill)
        # Only the frontend specs run here: the TYPO3 *backend* fires many concurrent requests that
        # php -S can't serve (the login deadlocks). The backend element spec runs in the e2e-imgproxy
        # job instead (DDEV / nginx-fpm). This job is the fast local-processor coverage. The polyfill
        # spec runs WebKit-only (project config); the <picture> spec runs in chromium.
        env:
          IMAGINATOR_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_CHANNEL: chromium
        run: npx playwright test frontend-picture.spec.ts sizes-auto-polyfill.spec.ts
      - if: failure()
        run: cat /tmp/php-server.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-imgproxy:
    name: e2e (imgproxy + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
      - name: Provision DDEV (typo3 + imgproxy add-on)
        run: |
          ddev config --project-type=typo3 --project-name=imaginator --docroot=.Build/public --php-version=8.3
          ddev add-on get barbieswimcrew/ddev-imgproxy
          ddev start
      - run: ddev composer install
      - name: Build the demo instance
        run: ddev exec bash Build/Scripts/setup-demo-instance.sh
      - name: Point imaginator at imgproxy
        # The project dir is mounted into the DDEV web container, so write the config on the host
        # (a nested heredoc inside `ddev exec "…"` breaks the outer shell parse) and flush in-container.
        # APPEND — do not clobber: ddev generates this additional.php (DB creds, trustedHostsPattern,
        # dev settings). Overwriting it drops trustedHostsPattern and 500s on the imaginator.ddev.site
        # host header. Seed `<?php` only if ddev didn't already create the file.
        run: |
          mkdir -p config/system
          F=config/system/additional.php
          [ -f "$F" ] || echo '<?php' > "$F"
          cat >> "$F" <<'PHP'
          $GLOBALS['TYPO3_CONF_VARS']['SYS']['trustedHostsPattern'] = '.*';
          $GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['imaginator']['processor'] = 'imgproxy';
          $GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['imaginator']['processorBaseUrl'] = 'https://imaginator.ddev.site:8081';
          PHP
          ddev exec .Build/bin/typo3 cache:flush
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright (frontend + backend + imgproxy)
        # chromium project only: it covers the backend + imgproxy + <picture> specs. The WebKit-only
        # sizes="auto" polyfill spec runs in the e2e-local job (which installs webkit); --project here
        # keeps this job from trying to launch a browser it does not install.
        env:
          IMAGINATOR_BASE_URL: https://imaginator.ddev.site
          PLAYWRIGHT_CHANNEL: chromium
        run: npx playwright test --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-imgproxy
          path: |
            playwright-report/
            test-results/
          retention-days: 7
