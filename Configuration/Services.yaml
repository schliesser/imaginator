services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Schliesser\Imaginator\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Attribute/'
      - '../Classes/DependencyInjection/'
      - '../Classes/Dto/'
      - '../Classes/Ladder/Rung.php'

  # Services whose constructors take scalar configuration are built via the factory.
  Schliesser\Imaginator\UrlBuilder\LocalAsyncUrlBuilder:
    factory: ['@Schliesser\Imaginator\Configuration\SettingsFactory', 'createLocalAsyncUrlBuilder']

  Schliesser\Imaginator\Ladder\LadderFactory:
    factory: ['@Schliesser\Imaginator\Configuration\SettingsFactory', 'createLadderFactory']

  # The active processor is chosen from the `processor` setting by the factory; the render layer +
  # middleware stay processor-agnostic behind the interface. Processors are collected by tag into a
  # lazy locator (keyed by `key`). Built-ins and integrator processors alike register via
  # #[AsImaginatorProcessor] (see ProcessorRegistrationPass, wired in Services.php); a manual
  # `imaginator.image_processor` tag with a `key` remains a supported alternative.
  Schliesser\Imaginator\Imaging\ImageProcessorInterface:
    factory: ['@Schliesser\Imaginator\Imaging\ImageProcessorFactory', 'create']

  Schliesser\Imaginator\Imaging\ImageProcessorRegistry:
    arguments:
      $processors: !tagged_locator { tag: 'imaginator.image_processor', index_by: 'key' }

  Schliesser\Imaginator\Middleware\ProcessImageRequest:
    public: true
