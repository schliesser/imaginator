services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Schliesser\Imaginator\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Dto/'
      - '../Classes/Ladder/Rung.php'
      - '../Classes/Url/CanonicalParams.php'

  # Services whose constructors take scalar configuration are built via the factory.
  Schliesser\Imaginator\Url\SignedUrlBuilder:
    factory: ['@Schliesser\Imaginator\Configuration\SettingsFactory', 'createSignedUrlBuilder']

  Schliesser\Imaginator\Ladder\LadderFactory:
    factory: ['@Schliesser\Imaginator\Configuration\SettingsFactory', 'createLadderFactory']

  # The active processor (local GraphicsMagick vs offloaded imgproxy) is chosen from settings by the
  # factory; the render layer + middleware stay processor-agnostic behind the interface.
  Schliesser\Imaginator\Imaging\ImageProcessorInterface:
    factory: ['@Schliesser\Imaginator\Imaging\ImageProcessorFactory', 'create']

  Schliesser\Imaginator\Imaging\Local\Backend\LocalBackendInterface:
    alias: Schliesser\Imaginator\Imaging\Local\Backend\GraphicsMagickBackend

  Schliesser\Imaginator\Middleware\ProcessImageRequest:
    public: true
